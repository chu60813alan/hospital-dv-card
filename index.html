<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭暴力防治宣導 - 多語言資訊專區</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #FFF9F2;
      color: #333333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(230, 120, 23, 0.15);
      padding: 28px 20px;
      text-align: center;
      border-top: 6px solid #E67E22;
    }
    h1 {
      font-size: 1.5rem;
      color: #D35400;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 0.95rem;
      color: #666666;
      margin-bottom: 24px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .lang-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background-color: #FFF3E6;
      border: 2px solid #F39C12;
      color: #D35400;
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .lang-btn:active {
      background-color: #E67E22;
      color: #FFFFFF;
      transform: scale(0.98);
    }
    .lang-btn .main-text { font-size: 1.1rem; }
    .lang-btn .sub-text { font-size: 0.85rem; opacity: 0.8; font-weight: normal; margin-top: 2px; }
    .footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #888888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>家庭暴力防治寶卡</h1>
    <p class="subtitle">讓每一種語言，都能找到求助的方向</p>
    
    <div class="btn-group">
      <a href="zh.html" class="lang-btn">
        <span class="main-text">繁體中文</span>
        <span class="sub-text">中文寶卡</span>
      </a>
      <a href="en.html" class="lang-btn">
        <span class="main-text">English</span>
        <span class="sub-text">English Card</span>
      </a>
      <a href="vi.html" class="lang-btn">
        <span class="main-text">Tiếng Việt</span>
        <span class="sub-text">Thẻ tiếng Việt</span>
      </a>
      <a href="id.html" class="lang-btn">
        <span class="main-text">Bahasa Indonesia</span>
        <span class="sub-text">Kartu Bahasa Indonesia</span>
      </a>
    </div>

    <div class="footer">
      如遇緊急狀況，請立即撥打 110 或 113 保護專線
    </div>
  </div>
</body>
</html>
